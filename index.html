function v420BossSkill(e,dt,d){

  const color={forest:0x7de5a1,valley:0x72e8d9,dungeon:0xc99aff,firelands:0xff8358,snowlands:0x9edaff,skylands:0xffe7a0}[activeZone]||0xffd78a;
  const g=new THREE.Group();g.name='V420_Boss_Warning';

  fx.charge-=dt;
  const progress=1-Math.max(0,fx.charge)/(fx.phase?1.2:1.7);
  fx.ring.material.opacity=.4+.4*Math.sin(nowT*12)**2;
  fx.disc.material.opacity=.08+progress*.23;

   fx.ring.material.opacity=0;fx.disc.material.opacity=0;
   const distance=Math.hypot(m.position.x-player.position.x,m.position.z-player.position.z);
   if(distance<3.7&&invuln<=0&&state.hp>0){
    const damage=Math.max(3,Math.ceil(e.atk*(fx.phase?1.65:1.2)-def()*.55));

  }

 }
 fx.clock-=dt;

function v340RiderPose(dt){

// V4.1.0: restrained riding arms and a horse that actually moves its limbs.
let v400GaitPhase=0,v400GaitBlend=0;
function v400MountMotion(dt,moved){
 if(!mountMesh310)return;
 const riding=!!state.mount310?.active;
 const moving=riding&&moved>.0001;
 v400GaitBlend=THREE.MathUtils.lerp(v400GaitBlend,moving?1:0,Math.min(1,dt*7));
 if(moving)v400GaitPhase+=moved*3.8;
 // Cache parts once. Their materials and meshes remain owned by the mount.
 if(!mountMesh310.userData.v400){
  const legs=mountMesh310.children.filter(c=>c.isMesh&&c.geometry?.type==='CylinderGeometry'&&Math.abs(c.position.y-.4)<.06&&Math.abs(c.position.x)>.3);
  const head=mountMesh310.children.find(c=>c.isMesh&&c.geometry?.type==='SphereGeometry'&&c.position.z>.7&&c.position.y>1.1);
  const tail=new THREE.Group();tail.position.set(0,1.05,-1.03);
  const hair=new THREE.Mesh(new THREE.ConeGeometry(.13,.78,7),new THREE.MeshStandardMaterial({color:0x47332a,roughness:.95}));
  hair.position.set(0,-.36,-.12);hair.rotation.x=-.3;tail.add(hair);mountMesh310.add(tail);
  const reins=new THREE.Group();const strapMat=new THREE.MeshStandardMaterial({color:0x493329,roughness:.88});
  for(const side of [-1,1]){
   const line=new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,.93,5),strapMat);
   line.position.set(side*.23,1.27,.49);line.rotation.x=.55;reins.add(line);
  }mountMesh310.add(reins);
  mountMesh310.userData.v400={legs,head,tail};
 }
 const rig=mountMesh310.userData.v400;
 for(const leg of rig.legs){
  const fore=leg.position.z>0,side=leg.position.x>0;
  const offset=(fore?(side?0:Math.PI):(side?Math.PI:0));
  leg.rotation.x=Math.sin(v400GaitPhase+offset)*.46*v400GaitBlend;
 }
 if(rig.head){rig.head.rotation.x=Math.sin(v400GaitPhase*2)*.065*v400GaitBlend;}
 rig.tail.rotation.z=Math.sin(nowT*2.7)*.19;
 rig.tail.rotation.x=Math.sin(v400GaitPhase)*.13*v400GaitBlend;
 // Subtle saddle bounce; player remains steady enough to keep hands on reins.
 if(riding){
  const desired=1.07+Math.abs(Math.sin(v400GaitPhase*2))*.035*v400GaitBlend;
  player.position.y=THREE.MathUtils.lerp(player.position.y,desired,Math.min(1,dt*9));
 }
}

   // Hide the old sphere/cylinder monster visuals, preserving its original entity,
   // AI, combat, health and label objects.
   e.mesh.children.forEach(c=>{if(c.name!=='V360_Anatomy')c.visible=false});
   rig=new THREE.Group();rig.name='V360_Anatomy';e.mesh.add(rig);e.mesh.userData.v360Rig=rig;
   const boss=!!e.boss||e.region?.type===4;
   const k=boss?1.55:1;
   const skin=new THREE.MeshStandardMaterial({color:cc[0],roughness:.86,flatShading:true});
   const accent=new THREE.MeshStandardMaterial({color:cc[1],roughness:.55,metalness:.14,emissive:cc[1],emissiveIntensity:.09,flatShading:true});
   const eye=new THREE.MeshStandardMaterial({color:0xfff1ba,emissive:0xf3be63,emissiveIntensity:.35});
   function part(geo,mat,x,y,z,sx=1,sy=1,sz=1){const m=new THREE.Mesh(geo,mat);m.position.set(x*k,y*k,z*k);m.scale.set(sx*k,sy*k,sz*k);rig.add(m);return m}
   function orb(x,y,z,r,mat=skin){return part(new THREE.IcosahedronGeometry(r,1),mat,x,y,z)}
   function spike(x,y,z,r,h,mat=accent){return part(new THREE.ConeGeometry(r,h,6),mat,x,y,z)}
   const style=zone==='forest'?'stag':zone==='valley'?'serpent':zone==='dungeon'?'golem':zone==='firelands'?'drake':zone==='snowlands'?'wolf':'bird';
   if(style==='stag'){
    part(new THREE.DodecahedronGeometry(.75),skin,0,1.02,0,1.1,.8,1.45);orb(0,1.47,.85,.45);for(const side of [-1,1]){for(const z of [-.55,.55])part(new THREE.CylinderGeometry(.13,.18,1.0,6),skin,side*.53,.53,z);const a=spike(side*.35,2.2,.8,.12,1.2);a.rotation.z=side*.43;spike(side*.65,2.3,.8,.1,.7)}
   }else if(style==='serpent'){
    for(let i=0;i<5;i++)orb(0,.85+Math.sin(i*.7)*.25,-1+i*.48,.47-i*.045);
    orb(0,1.28,1.05,.55);for(const side of [-1,1]){spike(side*.42,1.73,1.1,.22,.75);orb(side*.23,1.43,1.45,.1,eye)}
    for(let i=0;i<4;i++)spike(0,1.35,-.75+i*.5,.18,.65);
   }else if(style==='golem'){
    part(new THREE.BoxGeometry(1.25,1.45,.95),skin,0,1.15,0);part(new THREE.BoxGeometry(.9,.75,.85),accent,0,2.2,.1);
    for(const side of [-1,1]){part(new THREE.BoxGeometry(.45,1.25,.5),skin,side*.9,1.2,0);part(new THREE.BoxGeometry(.45,.8,.5),skin,side*.35,.35,0);orb(side*.22,2.3,.53,.1,eye)}
    orb(0,1.22,.54,.3,accent);
   }else if(style==='drake'){
    part(new THREE.DodecahedronGeometry(.8),skin,0,1.1,0,1.1,.8,1.4);orb(0,1.55,1,.53);for(const side of [-1,1]){const w=spike(side*1.0,1.75,-.25,.75,2.1);w.rotation.z=side*1.12;spike(side*.35,2.12,1.02,.2,.8);orb(side*.24,1.63,1.44,.11,eye)}
    for(let i=0;i<4;i++)spike(0,1.95,-.7+i*.4,.2,.65);
   }else if(style==='wolf'){
    part(new THREE.IcosahedronGeometry(.75,1),skin,0,1.05,0,1,.7,1.35);orb(0,1.35,.9,.49);part(new THREE.ConeGeometry(.28,.7,5),accent,0,1.13,1.48,1,.8,1);
    for(const side of [-1,1]){spike(side*.37,1.97,.9,.24,.75);orb(side*.24,1.47,1.29,.09,eye);for(const z of [-.6,.65])part(new THREE.CylinderGeometry(.15,.18,.85,6),skin,side*.52,.45,z)}
   }else{
    orb(0,1.45,0,.8);orb(0,2.08,.48,.4);for(const side of [-1,1]){const w=part(new THREE.ConeGeometry(.75,2.3,4),accent,side*1.05,1.55,-.3);w.rotation.z=side*1.13;orb(side*.2,2.14,.78,.09,eye);part(new THREE.CylinderGeometry(.09,.12,.9,5),skin,side*.27,.45,0)}
    spike(0,1.98,1.0,.16,.65);
   }
   if(boss){const halo=part(new THREE.TorusGeometry(1.65,.075,8,36),accent,0,2.8,0);halo.rotation.x=.35;rig.userData.halo=halo;rig.scale.setScalar(1.14)}
   rig.userData.phase=Math.random()*6.28;
   rig.userData.style=style;
   rig.userData.baseScale=rig.scale.x;
   rig.userData.animParts=rig.children.filter(c=>c.isMesh&&c.geometry&&['CylinderGeometry','ConeGeometry'].includes(c.geometry.type)).map((c,i)=>({mesh:c,baseX:c.rotation.x,baseZ:c.rotation.z,index:i}));
   rig.userData.attackPulse=0;
   rig.userData.hitPulse=0;
  }
  const u=rig.userData,phase=nowT*(u.style==='golem'?2.3:u.style==='bird'?7:5)+u.phase;
  const bob=u.style==='bird'?.2:u.style==='serpent'?.12:.06;
  rig.position.y=Math.sin(phase)*bob;
  rig.rotation.y=(u.style==='serpent'?Math.sin(phase*.55)*.12:Math.sin(phase*.4)*.035);
  rig.rotation.z=(u.style==='bird'?Math.sin(phase)*.075:Math.sin(phase*.6)*.025);
  for(const part of u.animParts){
   const wave=Math.sin(phase+part.index*Math.PI*.8);
   const amp=u.style==='bird'?.28:u.style==='serpent'?.15:u.style==='golem'?.07:.18;
   part.mesh.rotation.x=part.baseX+wave*amp;
   if(u.style==='bird')part.mesh.rotation.z=part.baseZ+wave*.13;
  }
  u.attackPulse=Math.max(0,(u.attackPulse||0)-dt*2.5);
  u.hitPulse=Math.max(0,(u.hitPulse||0)-dt*4);
  const pulse=1+u.attackPulse*.13-u.hitPulse*.07;
  rig.scale.setScalar(u.baseScale*pulse);
  if(u.halo){u.halo.rotation.z+=dt*(.55+u.attackPulse*3);u.halo.rotation.y+=dt*.3;}
 }
}

function v390BossAnimation(dt){
 if(activeZone==='city')return;
 for(const e of enemies){if(!e.active||!e.boss||!e.mesh)continue;

   const col=V390_THEME[activeZone]||0xffd38a;

   const aura=new THREE.Mesh(new THREE.TorusGeometry(1.2,.065,6,36),mat.clone());aura.position.y=1.5;fx.add(aura);
   fx.userData={ring,aura,seed:Math.random()*6.28};
